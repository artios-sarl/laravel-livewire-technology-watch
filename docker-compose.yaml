volumes:
  mariadb_data:

services:
  mariadb:
    image: mariadb:latest
    environment:
      - MARIADB_RANDOM_ROOT_PASSWORD=true
      - MYSQL_DATABASE=devprodmed
      - MYSQL_USER=user
      - MYSQL_PASSWORD=password
    ports:
      - 3306:3306
    volumes:
      - mariadb_data:/var/lib/mysql
